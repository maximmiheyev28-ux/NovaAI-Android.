name: Build Nova AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NovaAI_Android_Project_0_1_2.zip"
      - "nova-patch/**"
      - "model-runtime/**"
      - "nova-patch/NovaAI_Android/app/src/main/java/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract and patch project
        run: |
          set -e
          mkdir -p unpacked
          unzip -q NovaAI_Android_Project_0_1_2.zip -d unpacked
          cp -R nova-patch/NovaAI_Android/. unpacked/NovaAI_Android/
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path("unpacked/NovaAI_Android/app/build.gradle")
          original = app.read_text()
          print("--- ORIGINAL app/build.gradle ---")
          print(original)
          lines = original.splitlines()
          if not any("org.jetbrains.kotlin.android" in line for line in lines):
              plugin_index = next((i for i, line in enumerate(lines) if re.match(r"^\s*plugins\s*\{", line)), None)
              if plugin_index is not None:
                  line = lines[plugin_index]
                  insertion = "    id 'org.jetbrains.kotlin.android' version '2.1.20'"
                  if "}" in line[line.find("{") + 1:]:
                      lines[plugin_index] = line.replace("plugins {", "plugins {\n" + insertion + "\n", 1)
                  else:
                      lines.insert(plugin_index + 1, insertion)
              else:
                  bootstrap = [
                      "buildscript {",
                      "    repositories { google(); mavenCentral(); gradlePluginPortal() }",
                      "    dependencies { classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20' }",
                      "}",
                  ]
                  lines = bootstrap + lines
                  android_plugin = next((i for i, line in enumerate(lines) if "com.android.application" in line and ("apply plugin" in line or "id " in line)), None)
                  if android_plugin is not None:
                      lines.insert(android_plugin + 1, "apply plugin: 'org.jetbrains.kotlin.android'")
                  else:
                      android_block = next((i for i, line in enumerate(lines) if line.lstrip().startswith("android") and "{" in line), None)
                      if android_block is not None:
                          lines.insert(android_block, "apply plugin: 'org.jetbrains.kotlin.android'")
                      else:
                          lines.append("apply plugin: 'org.jetbrains.kotlin.android'")
          if not any("dev.ffmpegkit-maintained:llama-android:0.1.1" in line for line in lines):
              dependency_block = [i for i, line in enumerate(lines) if line.strip().startswith("dependencies") and "{" in line]
              if dependency_block:
                  lines.insert(dependency_block[-1] + 1, "    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'")
              else:
                  lines.extend(["", "dependencies {", "    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'", "}"])
          if not any("kotlinx-coroutines-android" in line for line in lines):
              dependency_block = [i for i, line in enumerate(lines) if line.strip().startswith("dependencies") and "{" in line]
              if dependency_block:
                  lines.insert(dependency_block[-1] + 1, "    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'")
              else:
                  lines.extend(["", "dependencies {", "    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'", "}"])
          # Normalize JVM targets rather than assuming the original file's formatting.
          text = "\n".join(lines)
          text = re.sub(r"(?m)^\s*compileOptions\s*\{[^}]*\}\s*\n?", "", text)
          text = re.sub(r"(?m)^\s*kotlinOptions\s*\{[^}]*\}\s*\n?", "", text)
          lines = text.splitlines()
          android_block = next((i for i, line in enumerate(lines) if re.match(r"^\s*android\s*\{", line)), None)
          if android_block is not None:
              lines.insert(android_block + 1, "    compileOptions {")
              lines.insert(android_block + 2, "        sourceCompatibility JavaVersion.VERSION_1_8")
              lines.insert(android_block + 3, "        targetCompatibility JavaVersion.VERSION_1_8")
              lines.insert(android_block + 4, "    }")
              lines.insert(android_block + 5, "    kotlinOptions { jvmTarget = '1.8' }")
          # Print complete compiler diagnostics and fail on the first real build error.
          app.write_text("\n".join(lines) + "\n")
          app.write_text("\n".join(lines) + "\n")
          PY
          sed -i 's/versionCode 1/versionCode 4/' unpacked/NovaAI_Android/app/build.gradle
          sed -i 's/versionCode 2/versionCode 4/' unpacked/NovaAI_Android/app/build.gradle
          sed -i 's/minSdk 23/minSdk 24/' unpacked/NovaAI_Android/app/build.gradle
          sed -i 's/versionName "0.1.2"/versionName "0.4.0"/' unpacked/NovaAI_Android/app/build.gradle
          sed -i 's/versionName "0.2.0"/versionName "0.4.0"/' unpacked/NovaAI_Android/app/build.gradle
          node --check unpacked/NovaAI_Android/app/src/main/assets/www/app.js
          grep -q 'dev.ffmpegkit-maintained:llama-android:0.1.1' unpacked/NovaAI_Android/app/build.gradle
          echo '--- patched app/build.gradle ---'
          sed -n '1,120p' unpacked/NovaAI_Android/app/build.gradle
      - name: Build APK
        run: |
          cd unpacked/NovaAI_Android
          gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: unpacked/NovaAI_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
