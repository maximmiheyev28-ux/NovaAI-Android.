name: Build Nova AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NovaAI_Android_Project_0_1_2.zip"
      - "nova-patch/**"
      - "model-runtime/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract and patch project
        run: |
          set -e
          mkdir -p unpacked
          unzip -q NovaAI_Android_Project_0_1_2.zip -d unpacked
          cp -R nova-patch/NovaAI_Android/. unpacked/NovaAI_Android/
          sed -i 's/versionCode 1/versionCode 3/' unpacked/NovaAI_Android/app/build.gradle
          sed -i 's/versionCode 2/versionCode 3/' unpacked/NovaAI_Android/app/build.gradle
          sed -i 's/versionName "0.1.2"/versionName "0.3.0"/' unpacked/NovaAI_Android/app/build.gradle
          sed -i 's/versionName "0.2.0"/versionName "0.3.0"/' unpacked/NovaAI_Android/app/build.gradle
          node --check unpacked/NovaAI_Android/app/src/main/assets/www/app.js
      - name: Build APK
        run: |
          cd unpacked/NovaAI_Android
          gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: unpacked/NovaAI_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
