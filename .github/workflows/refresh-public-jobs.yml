name: Refresh public remote jobs

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-public-jobs.yml"
      - "freelance-pult/collect_public_jobs.py"
      - "freelance-pult/merge_jobs_feed.py"
      - "freelance-pult/notify_telegram.py"
      - "freelance-pult/test_public_jobs.py"

permissions:
  contents: write

concurrency:
  group: refresh-public-jobs
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and publish public jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch last published snapshot
        shell: bash
        run: |
          git fetch origin jobs-feed:refs/remotes/origin/jobs-feed || true
          if git show origin/jobs-feed:freelance-pult/jobs.json > /tmp/previous-jobs.json 2>/dev/null; then
            echo "Loaded previous feed snapshot."
          else
            printf '{"items":[]}' > /tmp/previous-jobs.json
            echo "No previous snapshot; this is the first publish."
          fi

      - name: Collect and rank public jobs
        run: python3 freelance-pult/collect_public_jobs.py --output freelance-pult/jobs.json

      - name: Preserve recent results if sources are temporarily unavailable
        run: python3 freelance-pult/merge_jobs_feed.py --current freelance-pult/jobs.json --previous /tmp/previous-jobs.json --output freelance-pult/jobs.json --cache-hours 36

      - name: Save feed snapshot and notifier before publishing branch
        run: |
          cp freelance-pult/jobs.json /tmp/current-jobs.json
          cp freelance-pult/notify_telegram.py /tmp/notify_telegram.py

      - name: Publish JSON feed to jobs-feed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan jobs-feed
          git rm -rf . || true
          mkdir -p freelance-pult
          cp /tmp/current-jobs.json freelance-pult/jobs.json
          git add freelance-pult/jobs.json
          git commit -m "Refresh public remote jobs feed"
          git push --force origin jobs-feed

      - name: Notify Telegram about new listings (optional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram is not configured; feed published but no phone notification was sent."
            exit 0
          fi
          python3 /tmp/notify_telegram.py --previous /tmp/previous-jobs.json --current /tmp/current-jobs.json
